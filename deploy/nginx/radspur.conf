# nginx-Vorlage für Radspur, z. B. nach /etc/nginx/conf.d/radspur.conf
# server_name und proxy_pass anpassen, dann:  nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name radspur.example.at;

    # Tour-Uploads aus der App sind oft größer als der nginx-Standard von 1 MB
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

