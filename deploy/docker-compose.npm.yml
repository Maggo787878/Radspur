# Nur nötig, wenn nginx selbst als Container läuft (z. B. Nginx Proxy Manager):
# hängt Radspur zusätzlich in dessen Docker-Netzwerk. Netzwerknamen anpassen
# (docker network ls), dann:
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d
# Im Proxy als Ziel dann  http://radspur:8080  eintragen.

services:
  radspur:
    networks: [default, proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_default}
