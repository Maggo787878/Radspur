# Radspur-Server (HTTP auf Port 8080, gedacht für den Betrieb hinter nginx)
#   cp .env.example .env   # Werte anpassen
#   docker compose pull && docker compose up -d

services:
  radspur:
    image: ${RADSPUR_IMAGE:-ghcr.io/maggo787878/radspur-server:latest}
    container_name: radspur
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/radspur.db
    volumes:
      - radspur-data:/data
    # RADSPUR_BIND=127.0.0.1 → nur für nginx auf demselben Host erreichbar
    # RADSPUR_BIND=0.0.0.0   → auch von anderen Rechnern (nginx auf anderem Host)
    ports:
      - "${RADSPUR_BIND:-127.0.0.1}:${RADSPUR_PORT:-8080}:8080"

volumes:
  radspur-data:
