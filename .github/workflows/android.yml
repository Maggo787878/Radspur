name: Android-App

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Keystore aus Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.RADSPUR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radspur.jks"
            echo "RADSPUR_KEYSTORE=$RUNNER_TEMP/radspur.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Keystore-Secret gesetzt – APK wird mit Debug-Schlüssel signiert (Updates nicht möglich)."
          fi

      - name: Build
        env:
          RADSPUR_KEYSTORE_PASSWORD: ${{ secrets.RADSPUR_KEYSTORE_PASSWORD }}
          RADSPUR_KEY_ALIAS: ${{ secrets.RADSPUR_KEY_ALIAS }}
          RADSPUR_KEY_PASSWORD: ${{ secrets.RADSPUR_KEY_PASSWORD }}
          RADSPUR_VERSION_CODE: ${{ github.run_number }}
          RADSPUR_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/radspur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radspur-apk
          path: android/app/build/outputs/apk/release/radspur.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/radspur.apk
