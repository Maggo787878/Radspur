name: Android-App

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Keystore aus Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.RADSPUR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/radspur.jks"
            echo "RADSPUR_KEYSTORE=$RUNNER_TEMP/radspur.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Keystore-Secret gesetzt – APK wird mit Debug-Schlüssel signiert (Updates nicht möglich)."
          fi

      - name: Build
        env:
          RADSPUR_KEYSTORE_PASSWORD: ${{ secrets.RADSPUR_KEYSTORE_PASSWORD }}
          RADSPUR_KEY_ALIAS: ${{ secrets.RADSPUR_KEY_ALIAS }}
          RADSPUR_KEY_PASSWORD: ${{ secrets.RADSPUR_KEY_PASSWORD }}
          RADSPUR_VERSION_CODE: ${{ github.run_number }}
        run: |
          # Tag v1.2.3 -> Version 1.2.3, sonst Entwicklungsstand 0.0.<Laufnummer>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export RADSPUR_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else export RADSPUR_VERSION_NAME="0.0.$GITHUB_RUN_NUMBER-dev"; fi
          echo "Version: $RADSPUR_VERSION_NAME ($RADSPUR_VERSION_CODE)"
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/radspur.apk

      # Fingerabdruck des Signaturzertifikats prüfen: nur der eigene Schlüssel
      # erlaubt Updates über die installierte App.
      - name: Signatur prüfen
        env:
          EXPECTED_CERT_SHA256: 427be7619b46b4b5ec4278f6ffab237fae597adaf1127dc287fd727790905e32
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT=$("$BT/apksigner" verify --print-certs app/build/outputs/apk/release/radspur.apk)
          echo "$OUT" | grep -i "certificate"
          CERT=$(echo "$OUT" | grep -m1 -i "certificate SHA-256 digest:" | awk '{print $NF}')
          echo "Zertifikat SHA-256: $CERT"
          if [ -n "$RADSPUR_KEYSTORE" ] && [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK ist nicht mit dem Radspur-Schlüssel signiert (erwartet $EXPECTED_CERT_SHA256)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: radspur-apk
          path: android/app/build/outputs/apk/release/radspur.apk

      # Nur mit festem Schlüssel veröffentlichen – sonst ließe sich die APK
      # nicht über eine installierte Version aktualisieren.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && env.RADSPUR_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/radspur.apk
